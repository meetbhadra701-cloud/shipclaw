<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="ShipClaw tells you whether a repository is ready to ship: a deterministic readiness score, ranked blockers, a time-to-ship estimate, and an AI explanation that cannot change the score." />
    <title>ShipClaw — Is this repo ready to ship?</title>
    <!-- ShipClaw mark: hull + release check -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233565e8'/%3E%3Cpath d='M7 19.5h18l-2.6 5H9.6z' fill='white'/%3E%3Cpath d='M11 12.2l3.4 3.4L21.5 8.5' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <!-- Anti-FOUC: apply stored or system theme before first paint -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('shipclaw-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored || (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <!-- Skip navigation link — must be first focusable element in DOM order -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
