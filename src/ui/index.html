<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="ShipClaw — Release Readiness Agent Dashboard. View deterministic readiness scores, risk fingerprints, and time-to-ship estimates for your repositories." />
    <title>ShipClaw — Release Readiness Agent</title>
    <!-- SC monogram favicon — no emoji dependency -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='8' fill='%2376b900'/%3E%3Ctext x='18' y='25' text-anchor='middle' fill='white' font-size='15' font-weight='700' font-family='system-ui%2C-apple-system%2Csans-serif'%3ESC%3C/text%3E%3C/svg%3E" />
    <!-- Anti-FOUC: apply stored or system theme before first paint -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('shipclaw-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored || (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <!-- Skip navigation link — must be first focusable element in DOM order -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
